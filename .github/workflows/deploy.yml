name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: '30 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Fetch Google Fonts descriptions (sparse clone)
        continue-on-error: true
        run: |
          git clone --filter=blob:none --no-checkout --depth 1 https://github.com/google/fonts gf-repo
          git -C gf-repo sparse-checkout set --no-cone '*/DESCRIPTION.en.html'
          git -C gf-repo checkout
      - name: Fetch Google Fonts catalog
        env:
          GOOGLE_FONTS_API_KEY: ${{ secrets.GOOGLE_FONTS_API_KEY }}
          GF_DESC_DIR: gf-repo
        run: node scripts/fetch-google-fonts.mjs
      - run: npm run build
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
